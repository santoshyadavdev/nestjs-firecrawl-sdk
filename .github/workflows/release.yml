name: Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump (major, minor, patch, or exact like 1.2.3)'
        required: false
        type: string
      dry-run:
        description: 'Dry run (no publish, no git push)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"

      # Version, changelog, and tag
      - name: Version
        run: |
          FLAGS=""
          if [ -n "${{ inputs.specifier }}" ]; then
            FLAGS="$FLAGS --specifier=${{ inputs.specifier }}"
          fi
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          pnpm exec nx release $FLAGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish to npm
      - name: Publish
        if: inputs.dry-run != true
        run: pnpm exec nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
