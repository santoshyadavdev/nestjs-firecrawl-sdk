name: Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump (major, minor, patch, or exact like 1.2.3)'
        required: false
        type: string
      dry-run:
        description: 'Dry run (no publish, no git push)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"

      # Version, changelog, tag, and publish
      - name: Release
        run: |
          args=()
          if [[ -n "$SPECIFIER" ]]; then
            if [[ ! "$SPECIFIER" =~ ^(major|minor|patch|premajor|preminor|prepatch|prerelease|[0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              echo "::error::Invalid specifier: $SPECIFIER"
              exit 1
            fi
            args+=(--specifier "$SPECIFIER")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(--skip-publish)
          fi
          pnpm exec nx release "${args[@]}"
        env:
          SPECIFIER: ${{ inputs.specifier }}
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: inputs.dry-run != true
        run: pnpm exec nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
